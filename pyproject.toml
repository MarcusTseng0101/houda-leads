[project]
name = "houda-leads"
version = "0.1.0"
description = "厚達端子台潛在客戶開發工具（本機 CLI）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "openpyxl>=3.1",
]

[project.scripts]
houda-leads = "houda_leads.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houda_leads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
